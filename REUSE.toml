version = 1

[[annotations]]
path = ["**/*.json", "**/*.jsonl", "**/*.md", "**/*.toml", "**/*.txt", "**/*.yml", "**/*.yaml", ".editorconfig", ".gitattributes", ".gitignore", "**/.gitignore", "**/.formatter.exs", "server/mix.lock", "server/.env.example", "test/fixtures/**", "NOTICE"]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 ScriptKittyOS and the Kotiko contributors"
SPDX-License-Identifier = "Apache-2.0"

[[annotations]]
path = ["spec/VERSION", "extension/spec/VERSION"]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 ScriptKittyOS and the Kotiko contributors"
SPDX-License-Identifier = "Apache-2.0"

# Slice 08: generated from Unicode CLDR (spec/tools/gen-lang-data.mjs).
[[annotations]]
path = ["spec/languages.json", "spec/lang-aliases.json", "extension/spec/languages.json", "extension/spec/lang-aliases.json"]
precedence = "override"
SPDX-FileCopyrightText = ["2026 ScriptKittyOS and the Kotiko contributors", "1991-2026 Unicode, Inc."]
SPDX-License-Identifier = "Apache-2.0 AND Unicode-3.0"

# Slice 50: imported from stopwords-iso (spec/tools/import-stopwords.mjs).
[[annotations]]
path = ["spec/lang/_generic/stopwords.json", "extension/spec/lang/_generic/stopwords.json"]
precedence = "override"
SPDX-FileCopyrightText = ["2026 ScriptKittyOS and the Kotiko contributors", "2016 Gene Diaz and the stopwords-iso contributors"]
SPDX-License-Identifier = "Apache-2.0 AND MIT"

[[annotations]]
path = ["brand/**", "extension/*.png", "extension/ui/art/**"]
precedence = "override"
SPDX-FileCopyrightText = "2026 ScriptKittyOS"
SPDX-License-Identifier = "LicenseRef-KotikoBrand"

[[annotations]]
path = ["LICENSE", "LICENSES/**"]
precedence = "override"
SPDX-FileCopyrightText = "NONE"
SPDX-License-Identifier = "CC0-1.0"
