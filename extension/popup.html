<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Slovo</title>
  <style>
    :root {
      --paper: #f4f6f9;
      --grid: #dfe6ef;
      --ink: #1f3a68;
      --ink-soft: #5a6b85;
      --margin: #c2363b;
      --field: #ffffff;
      --ok: #2f6b4f;
      color-scheme: light dark;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --paper: #131b2b;
        --grid: #1d283d;
        --ink: #cfdcf2;
        --ink-soft: #8a9ab5;
        --margin: #e06469;
        --field: #0e1522;
        --ok: #7cc39f;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      width: 300px;
      font: 13px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      color: var(--ink);
      background-color: var(--paper);
      /* squared exercise-book paper with a red margin rule */
      background-image:
        linear-gradient(90deg, transparent 26px, var(--margin) 26px, var(--margin) 28px, transparent 28px),
        linear-gradient(var(--grid) 1px, transparent 1px),
        linear-gradient(90deg, var(--grid) 1px, transparent 1px);
      background-size: 100% 100%, 12px 12px, 12px 12px;
    }
    main { padding: 14px 16px 16px 40px; }
    h1 {
      margin: 0;
      font: 600 30px/1 Georgia, "PT Serif", "Times New Roman", serif;
      letter-spacing: -0.01em;
    }
    .status { margin: 6px 0 14px; color: var(--ink-soft); min-height: 1.45em; }
    .status.ok { color: var(--ok); }
    .status.err { color: var(--margin); }
    label { display: block; margin: 0 0 10px; }
    label > span { display: block; margin-bottom: 3px; color: var(--ink-soft); }
    input[type="text"], input[type="password"], select {
      width: 100%;
      padding: 6px 8px;
      font: inherit;
      color: var(--ink);
      background: var(--field);
      border: 1px solid var(--grid);
      border-radius: 4px;
    }
    .row { display: flex; align-items: center; gap: 8px; margin: 4px 0 8px; }
    .row input { margin: 0; accent-color: var(--margin); }
    .actions { display: flex; gap: 8px; margin-top: 12px; }
    button {
      flex: 1;
      padding: 7px 10px;
      font: inherit;
      font-weight: 600;
      color: var(--paper);
      background: var(--ink);
      border: 0;
      border-radius: 4px;
      cursor: pointer;
    }
    button.secondary { color: var(--ink); background: transparent; border: 1px solid var(--ink); }
    button:disabled { opacity: 0.5; cursor: default; }
    :focus-visible { outline: 2px solid var(--margin); outline-offset: 2px; }
    details { margin-top: 14px; }
    summary { cursor: pointer; color: var(--ink-soft); }
    details[open] summary { margin-bottom: 8px; }
  </style>
</head>
<body>
  <main>
    <h1>Слово</h1>
    <p class="status" id="status">Loading…</p>

    <label>
      <span>Language</span>
      <select id="lang">
        <option value="ru">Russian</option>
        <option value="zh">Mandarin</option>
      </select>
    </label>

    <div class="row">
      <input type="checkbox" id="enabled" />
      <label for="enabled" style="margin:0">Swap words on pages</label>
    </div>
    <div class="row">
      <input type="checkbox" id="paused" />
      <label for="paused" style="margin:0" id="pausedLabel">Pause on this site</label>
    </div>

    <div class="actions">
      <button id="syncNow">Sync now</button>
    </div>

    <details id="conn">
      <summary>Connection</summary>
      <label>
        <span>Server address</span>
        <input type="text" id="serverUrl" spellcheck="false" placeholder="http://localhost:4747" />
      </label>
      <label>
        <span>API token</span>
        <input type="password" id="token" spellcheck="false" placeholder="API_TOKEN from your .env" />
      </label>
      <div class="actions">
        <button class="secondary" id="save">Save connection</button>
      </div>
    </details>
  </main>
  <script src="popup.js"></script>
</body>
</html>
