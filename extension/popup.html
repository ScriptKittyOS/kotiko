<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width" />
  <title>Kotiko</title>
  <script src="ui/theme.js"></script>
  <link rel="stylesheet" href="ui/tokens.css" />
  <link rel="stylesheet" href="ui/base.css" />
  <link rel="stylesheet" href="ui/components.css" />
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <!--
    Slice 20. The DOM order is the keyboard order (20 §4): the add box first, the header
    last; CSS puts the header and banner on top. Every string comes from _locales through
    KotikoI18n (data-i18n* attributes here, t() in popup.js).
  -->
  <div class="popup" id="main" data-ready="false">
    <section class="add" aria-labelledby="addLabel">
      <form class="add-form" id="addForm" autocomplete="off">
        <label class="sr-only" id="addLabel" for="addText" data-i18n="popup_add_label"></label>
        <input class="field add-field" id="addText" type="text" dir="auto" spellcheck="false" maxlength="200"
               enterkeyhint="done" data-i18n-placeholder="popup_add_placeholder" />
        <!-- 24 §8: the language hint chip ("Auto ▾") goes here when slice 24 ships. -->
        <button class="add-submit" id="addBtn" type="submit" data-i18n-aria-label="popup_add_submit" data-i18n-title="popup_add_submit">
          <span data-icon="enter" data-icon-size="18"></span>
        </button>
      </form>
      <!-- Slice 10: free lookups left today, from the server's /api/v1/llm/status. -->
      <p class="add-quota" id="lookupsLeft" hidden></p>
      <ul class="jobs" id="jobs" aria-live="polite"></ul>
    </section>

    <div class="banners" id="banners"></div>

    <div class="middle" id="middle">
      <section class="first-run card" id="firstRun" hidden aria-labelledby="firstRunTitle">
        <img class="first-run-art art-light" src="ui/art/kitten-curious.png" alt="" width="64" height="57" />
        <img class="first-run-art art-dark" src="ui/art/kitten-curious-on-purple.png" alt="" width="64" height="55" />
        <div class="first-run-text">
          <h2 class="first-run-title" id="firstRunTitle" data-i18n="popup_first_run_title"></h2>
          <p class="first-run-body" id="firstRunBody" data-i18n="popup_first_run_body"></p>
          <button class="btn btn-primary" id="getStarted" type="button" data-i18n="popup_get_started"></button>
        </div>
      </section>

      <section class="section" id="langSection" aria-labelledby="langTitle">
        <div class="section-head">
          <h2 class="section-title" id="langTitle" data-i18n="popup_languages_title"></h2>
          <button class="link section-action" id="showAll" type="button" hidden data-i18n="popup_show_all"></button>
        </div>
        <p class="only-strip" id="onlyStrip" hidden></p>
        <div class="chips" id="chips" role="toolbar" aria-labelledby="langTitle" aria-describedby="chipsHint"></div>
        <p class="sr-only" id="chipsHint" data-i18n="popup_lang_keys_hint"></p>
        <div class="empty" id="emptyWords" hidden>
          <img class="empty-art art-light" src="ui/art/kitten-curious.png" alt="" width="48" height="43" />
          <img class="empty-art art-dark" src="ui/art/kitten-curious-on-purple.png" alt="" width="48" height="41" />
          <p data-i18n="popup_empty"></p>
        </div>
      </section>

      <section class="section" id="pageSection" hidden aria-labelledby="pageTitle">
        <h2 class="section-title" id="pageTitle"></h2>
        <button class="switch-row" id="pauseRow" type="button" role="switch" aria-checked="false">
          <span data-i18n="popup_pause_site"></span>
          <span class="switch" aria-hidden="true"></span>
        </button>
        <div class="paused-row" id="pausedRow" hidden>
          <span class="paused-text" id="pausedText"></span>
          <button class="btn btn-secondary btn-sm" id="resume" type="button" data-i18n="popup_resume"></button>
        </div>
        <p class="page-note" id="unsupported" hidden>
          <span data-icon="info" data-icon-size="16"></span>
          <span data-i18n="error_unsupported_page"></span>
        </p>
        <!-- 20 states H and H2: a page in a language the learner doesn't read, or in one with no words yet. -->
        <div class="page-note" id="pageLang" hidden>
          <span data-icon="info" data-icon-size="16"></span>
          <span id="pageLangText"></span>
        </div>
        <!-- 31: Amount; 32: coverage meter; 38: per-site languages and "Swap here anyway". -->
      </section>
    </div>

    <footer class="foot" id="foot">
      <span class="foot-count num" id="count"></span>
      <!-- 21: the dashboard, with every word (the browser's Options page). -->
      <button class="link foot-link" id="openDashboard" type="button">
        <span data-i18n="popup_open_dashboard"></span>
        <span data-icon="chevron" data-icon-size="16"></span>
      </button>
    </footer>

    <header class="bar">
      <img class="mark" src="icon32.png" alt="" width="20" height="20" />
      <h1 class="wordmark" data-i18n="extName"></h1>
      <span class="pill pill-info" id="offline" hidden>
        <span data-icon="info" data-icon-size="14"></span>
        <span data-i18n="popup_offline"></span>
      </span>
      <span class="bar-space"></span>
      <button class="master" id="enabled" type="button" role="switch" aria-checked="true" data-i18n-aria-label="popup_switch_label" data-i18n-title="popup_switch_label">
        <span class="master-text" id="enabledText" aria-hidden="true"></span>
        <span class="switch" aria-hidden="true"></span>
      </button>
      <button class="btn btn-icon" id="openSettings" type="button" data-i18n-aria-label="popup_settings" data-i18n-title="popup_settings">
        <span data-icon="sliders"></span>
      </button>
    </header>
  </div>

  <!--
    Server connection settings, inside the popup since slice 20. The token goes to the
    background (slice 11 §3) and is never read back; the AI key for lookups is typed only
    in the dashboard's settings (DECISIONS: a full extension page, never the popup).
  -->
  <div class="popup settings" id="settings" hidden>
    <header class="bar">
      <button class="btn btn-icon" id="closeSettings" type="button" data-i18n-aria-label="settings_back" data-i18n-title="settings_back">
        <span data-icon="back"></span>
      </button>
      <h1 class="bar-title" id="settingsTitle" data-i18n="popup_settings"></h1>
    </header>
    <form class="conn" id="connForm" autocomplete="off" aria-labelledby="connTitle">
      <h2 class="section-title" id="connTitle" data-i18n="settings_connection"></h2>
      <p class="conn-help" data-i18n="settings_connection_help"></p>
      <div class="conn-field">
        <label class="field-label" for="serverUrl" data-i18n="settings_server_address"></label>
        <input class="field" id="serverUrl" type="text" inputmode="url" spellcheck="false" placeholder="http://localhost:4747" />
      </div>
      <div class="conn-field">
        <label class="field-label" for="accessKey" data-i18n="settings_access_key"></label>
        <div class="key-wrap">
          <input class="field" id="accessKey" type="password" spellcheck="false" autocomplete="off" aria-describedby="accessKeyHelp" />
          <button class="btn btn-quiet btn-sm key-toggle" id="toggleKey" type="button" aria-controls="accessKey" aria-pressed="false" data-i18n="settings_show_key"></button>
        </div>
        <p class="field-help" id="accessKeyHelp" data-i18n="settings_access_key_help"></p>
      </div>
      <div class="conn-actions">
        <button class="btn btn-primary" id="saveConn" type="submit" data-i18n="settings_save"></button>
        <button class="btn btn-quiet" id="checkNow" type="button" data-i18n="settings_check_now"></button>
      </div>
      <div class="conn-status" id="connStatus" role="status" aria-live="polite"></div>
    </form>
    <!-- Voices for the speak button (slice 34): local voices only unless allowed here. -->
    <section class="voices" aria-labelledby="voicesTitle">
      <h2 class="section-title" id="voicesTitle" data-i18n="settings_voices"></h2>
      <button class="switch-row" id="onlineVoices" type="button" role="switch" aria-checked="false" aria-describedby="onlineVoicesHelp">
        <span data-i18n="settings_online_voices"></span>
        <span class="switch" aria-hidden="true"></span>
      </button>
      <p class="field-help" id="onlineVoicesHelp" data-i18n="settings_online_voices_help"></p>
    </section>
  </div>

  <script src="lib/i18n.js"></script>
  <script src="ui/icons.js"></script>
  <script src="lib/lookup-status.js"></script>
  <script src="popup.js"></script>
</body>
</html>
