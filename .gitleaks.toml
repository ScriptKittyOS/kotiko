#
# Secret scanning for CI (the `secrets` job) and for anyone running
# `gitleaks git --config .gitleaks.toml` locally. gitleaks' default rules, plus one
# allowance: test keys are written as obvious placeholders that contain "0123456789"
# (for example "sk-or-v1-0123456789abcdef…"). A real key containing that run is
# vanishingly unlikely; write new test keys the same way.
#
# The other stopwords are the nonces of the published test vectors for the server's proof
# route and signed requests (docs/reference/http-api.md). They are public examples, not
# secrets, and the extension and server tests check them byte for byte. The last is the
# release key's public SSH fingerprint (MAINTAINERS.md, .github/allowed_signers), which the
# security reviews quote.

[extend]
useDefault = true

[allowlist]
description = "Placeholder keys in tests"
stopwords = [
  "0123456789",
  "q1aP3n0ZKcB1x5mW0u7S9b",
  "dE8gH0iL2nO4pQ6rS8tU0v",
  "HqIaFq/thUm844NjYC3a+4Br40cqD2yJHEq1L2iiw4E",
]
