<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <title>RTL fixture</title>
</head>
<body>
  <!-- Slice 17: right-to-left pages with English inserts. -->
  <p id="ar">مرحبا بكم في موقعنا. The house is here. شكرا لكم.</p>
  <p id="he" lang="he">ברוכים הבאים. Thanks for coming to the house. תודה.</p>
  <p id="en" lang="en" dir="ltr">An English paragraph about a house, thanks.</p>
  <!-- Punctuation next to a right-to-left swap on a left-to-right page, and a left-to-right
       swap on a right-to-left page: the punctuation stays on the correct side. -->
  <p id="en-bang" lang="en" dir="ltr">Many thanks! See you.</p>
  <p id="en-paren" lang="en" dir="ltr">We said (thanks) and left.</p>
  <p id="ar-paren">قلنا (شكرا) وغادرنا.</p>
</body>
</html>
