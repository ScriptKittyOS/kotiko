name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # No secret in any commit of this branch's history (gitleaks with .gitleaks.toml). The
  # binary is a pinned release checked against its SHA-256, no third-party action. Also: no
  # .env, database, key or oversized file in the tree or a pull request's commits (GitHub's
  # push rulesets work only on private repositories), and every commit a pull request adds
  # is signed off (the Developer Certificate of Origin, CONTRIBUTING.md).
  #
  # On a pull request, gitleaks' settings and the check scripts come from the base commit,
  # so a pull request can't switch off its own checks (security review C-01): its edits to
  # them take effect once it is merged. On main they come from the tree.
  secrets:
    runs-on: ubuntu-24.04
    env:
      GITLEAKS_VERSION: "8.30.1"
      GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install gitleaks
        run: |
          curl -sSfL -o "$RUNNER_TEMP/gitleaks.tar.gz" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks
      # Security review C-01's regression test, with this gitleaks: a pull request that adds a
      # token and allows it in its own .gitleaks.toml and .gitleaksignore still fails.
      - name: A pull request can't switch off its own scan (test)
        env:
          GITLEAKS: ${{ runner.temp }}/gitleaks
        run: node --test test/unit/pr-checks-base.test.mjs
      - name: The checks' settings and scripts, from the base commit on a pull request
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          ref="${BASE:-HEAD}"
          git cat-file -e "$ref^{commit}"
          # The base's own copy of the helper. Only the pull request that adds it has none.
          if git cat-file -e "$ref:scripts/base-file.sh" 2>/dev/null; then
            git show "$ref:scripts/base-file.sh" > "$RUNNER_TEMP/base-file.sh"
          else
            echo "::warning title=No base-file.sh on the base::Using this tree's copy; only the pull request that adds it should see this."
            cp scripts/base-file.sh "$RUNNER_TEMP/base-file.sh"
          fi
          bash "$RUNNER_TEMP/base-file.sh" "$ref" "$RUNNER_TEMP/trusted" \
            .gitleaks.toml .gitleaksignore scripts/check-forbidden-files.mjs scripts/check-dco.mjs
          # gitleaks also reads the .gitleaksignore of the folder it scans, whatever
          # --gitleaks-ignore-path says, so the tree's copies go.
          rm -f .gitleaks.toml .gitleaksignore
      - name: Scan the full history
        # HEAD's full history (all of main plus this pull request's commits). Not --all: the
        # checkout fetches every branch, and another branch's finding would fail this one.
        # Inline "gitleaks:allow" comments don't count: a pull request could add one.
        run: >-
          "$RUNNER_TEMP/gitleaks" git --log-opts="HEAD" --redact --exit-code 1
          --config "$RUNNER_TEMP/trusted/.gitleaks.toml" --gitleaks-ignore-path "$RUNNER_TEMP/trusted/.gitleaksignore" --ignore-gitleaks-allow
          .
      - name: No secret, database or oversized files
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        # Without a pull request (a push to main), the tree only.
        run: node "$RUNNER_TEMP/trusted/scripts/check-forbidden-files.mjs" ${BASE:+"$BASE" "$HEAD"}
      - name: Every commit is signed off (DCO)
        if: github.event_name == 'pull_request'
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: node "$RUNNER_TEMP/trusted/scripts/check-dco.mjs" "$BASE" "$HEAD"

  server:
    name: server (${{ matrix.elixir }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - { elixir: "1.15.8", otp: "26.2", current: false } # minimum supported (mix.exs: ~> 1.15)
          - { elixir: "1.19.2", otp: "28.1", current: true }
    defaults:
      run:
        working-directory: server
    env:
      MIX_ENV: test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          otp-version: ${{ matrix.otp }}
          elixir-version: ${{ matrix.elixir }}
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            server/deps
            server/_build
          key: mix-${{ matrix.otp }}-${{ matrix.elixir }}-${{ hashFiles('server/mix.lock') }}
          restore-keys: mix-${{ matrix.otp }}-${{ matrix.elixir }}-
      - run: mix deps.get
      - run: mix format --check-formatted
        if: matrix.current
      - run: mix compile --warnings-as-errors
      - run: mix credo --strict
        if: matrix.current
      - run: mix hex.audit
      - run: mix deps.audit
      # Security-focused static analysis: any finding fails (server/.sobelow-conf).
      - run: mix sobelow
        if: matrix.current
      - run: mix deps.unlock --check-unused
      - run: mix test --warnings-as-errors
        if: ${{ !matrix.current }}
      # The coverage gate (90 % of lines, mix.exs) on one compiler only: line counts differ
      # a little between Elixir versions, and cover makes the run slower.
      - run: mix test --warnings-as-errors --cover
        if: matrix.current

  extension:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      # Every unit, DOM and background test (property tests and assertion mode included),
      # failing below 90 % line or 80 % branch coverage of extension/.
      - run: npm run coverage
      - run: npm run perf

  # Slices 08 and 09: the shared spec. The extension's copy is current, the CLDR-derived
  # files match the pinned CLDR, the full-output snapshot matches the JavaScript pipeline,
  # the recorded evaluation answers re-score to RESULTS.md (no network), and the shared
  # fixtures pass in both runtimes.
  spec:
    name: shared spec
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          otp-version: "28.1"
          elixir-version: "1.19.2"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            server/deps
            server/_build
          key: mix-28.1-1.19.2-${{ hashFiles('server/mix.lock') }}
          restore-keys: mix-28.1-1.19.2-
      - run: npm ci
      - run: node spec/tools/sync-extension.mjs --check
      - run: node spec/tools/import-stopwords.mjs --check
      - run: node spec/tools/gen-lang-data.mjs --check
      - run: node spec/tools/fixture-results.mjs --check
      - run: node spec/eval/run-eval.mjs --replay --set all --check
      - run: node --test test/unit/lang.test.mjs test/unit/wordspec.test.mjs test/unit/eval.test.mjs
      - run: mix deps.get && mix test --only spec
        working-directory: server
        env:
          MIX_ENV: test

  repo:
    name: versions and licenses
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: node scripts/check-versions.mjs
      - run: node scripts/check-old-name.mjs
      # Slice 50 §7 rule 1: no English-named base concepts in code.
      - run: node scripts/check-base-neutral.mjs
      # Slice 05/22: the "Why Kotiko?" story's copies match its single source.
      - run: node scripts/sync-story.mjs --check
      # Slice 53: every OpenSSF answer can go on the bestpractices.dev form as written.
      - run: node scripts/bestpractices-links.mjs --check
      # Slice 06: every text and control color pair meets WCAG 2.2 AA in both themes, and
      # tokens.css matches the palette derived from the brand purple.
      - run: node extension/ui/tools/contrast.mjs
      - run: node extension/ui/tools/derive-palette.mjs --check
      - run: pipx run reuse lint

  shell:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: shellcheck server/*.sh scripts/*.sh

  e2e:
    needs: [extension]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          otp-version: "28.1"
          elixir-version: "1.19.2"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            server/deps
            server/_build
          key: mix-28.1-1.19.2-${{ hashFiles('server/mix.lock') }}
          restore-keys: mix-28.1-1.19.2-
      - run: npm ci
      # Firefox only for slice 17's stylesheet check (the extension runs in Chromium here).
      - run: npx playwright install --with-deps chromium firefox
      # The full-stack spec boots the real server in dev (the test config never opens a port).
      - run: mix deps.get && mix compile
        working-directory: server
      - run: npm run e2e
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
