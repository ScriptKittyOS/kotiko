#
# CodeQL, GitHub's security analyser: JavaScript (the extension, scripts, tests and the
# docs site) and the GitHub Actions workflows themselves (script injection, untrusted
# checkouts, over-broad tokens). Nothing to build: both are analysed from source.
# Results go to the Security tab's code scanning alerts and to the "Code scanning results"
# check on each pull request. The rules are in
# docs/security/dependency-and-static-analysis-policy.md.
name: CodeQL

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "41 4 * * 1"

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  analyze:
    name: analyze (${{ matrix.language }})
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      security-events: write # upload the results to code scanning
    strategy:
      fail-fast: false
      matrix:
        language: [actions, javascript-typescript]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          # The default queries plus the security-extended ones (more checks, a few more
          # findings to triage).
          queries: security-extended
      - uses: github/codeql-action/analyze@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          category: /language:${{ matrix.language }}
